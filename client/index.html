<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>키이사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  font-family: "Noto Sans KR", sans-serif;
  overflow:hidden; background:#0f0f1a; color:#fff;
}
canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; }
.container { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; flex-direction:column; z-index:1; transition:opacity 1s ease; }
.hidden { opacity:0; pointer-events:none; }

#mainPage h1 {
  font-size:5rem; margin-bottom:60px;
  background:linear-gradient(90deg,#4facfe,#00f2fe);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:glow 2s ease-in-out infinite alternate;
}
@keyframes glow { 0%{text-shadow:0 0 10px #4facfe,0 0 20px #00f2fe;} 100%{text-shadow:0 0 20px #00f2fe,0 0 40px #4facfe;} }

.btn {
  display:inline-block; padding:15px 50px; margin:0 20px;
  font-size:1.3rem; border:none; border-radius:50px; cursor:pointer;
  background:linear-gradient(90deg,#4facfe,#00f2fe); color:#fff; font-weight:bold;
  transition:transform 0.3s, box-shadow 0.3s;
}
.btn:hover { transform:translateY(-5px) scale(1.05); box-shadow:0 10px 20px rgba(78,172,254,0.5); }

#chatPage {
  display: flex;
  width: 90%;
  max-width: 1000px;
  height: 80%;
  background: #e6f5f4;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
#chatPage.active { opacity:1; }

#sidebar {
  width: 230px;
  background: #6fbcb6;
  display: flex;
  flex-direction: column;
  padding: 20px;
  box-sizing: border-box;
  color: #fff;
}
#sidebar h2 {
  font-weight: 700;
  font-size: 1.6rem;
  text-align: center;
  margin: 0 0 20px 0;
}
#chatList {
  flex: 1;
  overflow-y: auto;
  padding-right: 5px;
}
.chat-item {
  padding: 10px 12px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.chat-item:hover {
  background: rgba(255,255,255,0.35);
}
#newChatBtn {
  background: #fff;
  color: #4aa49d;
  border: none;
  padding: 10px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}
#newChatBtn:hover {
  background: #d8f0ef;
  transform: translateY(-2px);
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f7fffe;
  color: #333;
}
#chatHistory {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 0.95rem;
  animation: fadeIn 0.3s ease forwards;
  opacity: 0;
}
.user-message {
  background: #4aa49d;
  color: #fff;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}
.bot-message {
  background: #e4f2f1;
  color: #333;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}


#inputArea {
  display: flex;
  gap: 8px;
  padding: 16px 20px;
  border-top: 1px solid #d8e9e8;
  background: #fff;
  box-sizing: border-box;
}
#userInput {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #c4e1df;
  outline: none;
  font-size: 1rem;
  font-family: inherit;
}
#userInput:focus {
  border-color: #4aa49d;
}
#sendBtn {
  background: #4aa49d;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease;
}
#sendBtn:hover {
  background: #63bdb5;
}

@keyframes fadeIn {
  to { opacity: 1; transform: translateY(0); }
  from { opacity: 0; transform: translateY(6px); }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="mainPage" class="container">
  <h1>키이사</h1>
  <div>
    <button class="btn" id="loginBtn" action="auth/login">로그인</button>
    <button class="btn" id="signupBtn" action="auth/signIn">회원가입</button>
  </div>
</div>

<div id="chatPage" style="display: none;">
  <div id="sidebar">
    <h2>키이사</h2>
    <div id="chatList"></div>
    <button id="newChatBtn">+ 새 채팅</button>
  </div>
  <div id="main">
    <div id="chatHistory"></div>
    <div id="inputArea">
      <input type="text" id="userInput" placeholder="메시지를 입력하세요..." autocomplete="off" />
      <button id="sendBtn">보내기</button>
    </div>
  </div>
</div>

<script src="./chatbot.js"></script>
<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let w,h;
function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
window.addEventListener('resize',resize); resize();

class Particle { constructor(){this.reset();}
reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.r=Math.random()*3+1;this.vx=(Math.random()-0.5)*0.5;this.vy=(Math.random()-0.5)*0.5;this.a=Math.random()*0.5+0.3;}
update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset();}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(78,172,254,${this.a})`;ctx.fill();}}

let particles=[]; for(let i=0;i<200;i++) particles.push(new Particle());
let animId;
function animate(){
  ctx.clearRect(0,0,w,h);
  for(let p of particles){p.update();p.draw();}
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      let dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
      ctx.strokeStyle=`rgba(78,172,254,${0.2-dist/500})`;ctx.lineWidth=1;ctx.stroke();}
    }
  }
  animId=requestAnimationFrame(animate);
}
animate();

const mainPage=document.getElementById('mainPage');
const chatPage=document.getElementById('chatPage');
const loginBtn=document.getElementById('loginBtn');
const signupBtn=document.getElementById('signupBtn');

loginBtn.addEventListener('click', () => {
  window.location.href = './login.html';  // ✅ login.html로 이동
});

signupBtn.addEventListener('click', () => {
  window.location.href = './signup.html'; // ✅ signup.html로 이동
});


window.addEventListener('DOMContentLoaded', () => {
  const mainPage = document.getElementById('mainPage');
  const chatPage = document.getElementById('chatPage');
  const canvas = document.getElementById('bg');

  // 항상 메인페이지부터 시작
  chatPage.style.display = 'none';
  mainPage.style.display = 'flex';
  canvas.style.display = 'block';

  if (document.cookie.includes('USER=')) {
    showChatPage();
  }
});

function showChatPage() {
  const main = document.getElementById('mainPage');
  const chat = document.getElementById('chatPage');
  const canvas = document.getElementById('bg');

  // 페이드아웃
  main.style.opacity = '0';
  canvas.style.opacity = '0';

  setTimeout(() => {
    main.style.display = 'none';
    canvas.style.display = 'none';
    chat.style.display = 'flex';
    chat.style.opacity = '0';

    // 페이드인
    setTimeout(() => {
      chat.style.transition = 'opacity 0.8s ease';
      chat.style.opacity = '1';
    }, 50);
  }, 500);
}

  // 로그인 성공 시 실행 (예시)
  function login() {
    // 여기에 실제 로그인 로직 넣고 성공 시:
    showChatPage();
  }

</script>
</body>
</html>
