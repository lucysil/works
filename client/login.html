<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>로그인</title>
<style>
body{background:#0f0f1a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:"Noto Sans KR",sans-serif;}
form{background:#1e1e2e;padding:40px;border-radius:20px;display:flex;flex-direction:column;gap:20px;width:300px;}
input,button{padding:10px;border:none;border-radius:10px;outline:none;}
button{background:linear-gradient(90deg,#4facfe,#00f2fe);color:#fff;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<form id="loginForm">
<h2>로그인</h2>
<input id="username" placeholder="아이디" required>
<input id="password" type="password" placeholder="비밀번호" required>
<button>로그인</button>
</form>

<!-- login.html -->
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const response = await fetch("https://overflowingly-closefisted-samir.ngrok-free.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });

    if (response.ok) {
      alert("로그인 성공!");
      // ✅ 로그인 성공 시 MBTI 페이지로 이동
      window.location.href = "mbti.html";
    } else {
      const data = await response.json();
      alert(data.message || "로그인 실패");
    }
  } catch (error) {
    console.error(error);
    alert("서버 오류 발생");
  }
});
</script>

</body>
</html>
