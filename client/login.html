<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>로그인</title>
<style>
body{background:#0f0f1a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:"Noto Sans KR",sans-serif;}
form{background:#1e1e2e;padding:40px;border-radius:20px;display:flex;flex-direction:column;gap:20px;width:300px;}
input,button{padding:10px;border:none;border-radius:10px;outline:none;}
button{background:linear-gradient(90deg,#4facfe,#00f2fe);color:#fff;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<form id="loginForm">
<h2>로그인</h2>
<input id="username" placeholder="아이디" required>
<input id="password" type="password" placeholder="비밀번호" required>
<button>로그인</button>
</form>

<script>
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value.trim();

  const res=await fetch('http://localhost:3000/auth/login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({username,password})
  });
  const data=await res.json();
  alert(data.message);
  if(data.success)location.href='./index.html';
});
</script>
</body>
</html>
